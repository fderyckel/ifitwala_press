services:
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes"]

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  backend:
    image: ${RUNTIME_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis-cache
      - redis-queue
      - redis-socketio
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
      - ./runtime-config:/workspace/runtime-config
      - ${FOUNDER_RUNTIME_SCRIPTS_DIR}:/workspace/founder_runtime/scripts:ro
    command: ["/bin/bash", "/workspace/founder_runtime/scripts/run-backend.sh"]

  worker:
    image: ${RUNTIME_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
      - ./runtime-config:/workspace/runtime-config
      - ${FOUNDER_RUNTIME_SCRIPTS_DIR}:/workspace/founder_runtime/scripts:ro
    command: ["/bin/bash", "/workspace/founder_runtime/scripts/run-worker.sh"]

  scheduler:
    image: ${RUNTIME_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
      - ./runtime-config:/workspace/runtime-config
      - ${FOUNDER_RUNTIME_SCRIPTS_DIR}:/workspace/founder_runtime/scripts:ro
    command: ["/bin/bash", "/workspace/founder_runtime/scripts/run-scheduler.sh"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
